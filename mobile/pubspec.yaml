name: safealert
description: SafeAlert ICT - indoor incident alert, BLE positioning and evacuation navigation.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # local database (14 tables)
  sqflite: ^2.3.3
  path: ^1.9.0
  # BLE scanning (Android reads iBeacon frames; iOS needs CoreLocation, see README)
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # sync with the Edge Server
  http: ^1.2.2
  uuid: ^4.4.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # lets unit tests open SQLite on a desktop machine
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/maps/
